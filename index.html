
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family OS</title>
<style>
:root {
  --navy:#203E59;
  --blue:#8FB6CC;
  --cream:#F5F0E6;
  --beige:#E7DCCB;
  --white:#FFFFFF;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:var(--cream);
 color:var(--navy);
}
header{
 background:var(--navy);
 color:white;
 padding:22px;
 text-align:center;
}
header h1{margin:0;font-size:27px;letter-spacing:2px}
header p{margin:7px 0 0;color:#DCE8EE}
main{max-width:850px;margin:auto;padding:20px}
.welcome{
 background:var(--navy);
 color:white;
 border-radius:20px;
 padding:35px 20px;
 text-align:center;
 margin-top:25px;
}
.welcome h2{font-size:30px;margin:10px}
.welcome p{color:#E4EAF0;line-height:1.6}
button{
 background:var(--blue);
 color:var(--navy);
 border:0;
 padding:14px 22px;
 border-radius:12px;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
}
button:active{opacity:.75}
.primary{margin-top:18px}
.section-title{margin:25px 0 15px}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.tile{
 background:white;
 border:1px solid var(--beige);
 border-radius:16px;
 padding:19px 12px;
 text-align:left;
 cursor:pointer;
 min-height:105px;
}
.tile .emoji{font-size:27px}
.tile strong{display:block;margin-top:10px;font-size:15px}
.tile small{display:block;margin-top:5px;color:#71808C}
.panel{
 background:white;
 padding:22px;
 border-radius:18px;
 margin-top:20px;
}
.panel h2{margin-top:0}
.back{background:var(--beige);margin-bottom:15px}
input,textarea{
 width:100%;
 padding:13px;
 border:1px solid #C9D4DC;
 border-radius:10px;
 margin:8px 0;
 font:inherit;
}
.task{
 padding:13px 0;
 border-bottom:1px solid var(--beige);
 display:flex;
 gap:10px;
 align-items:center;
}
.task input{width:auto;margin:0}
.task.done span{text-decoration:line-through;color:#82909A}
.hidden{display:none}
footer{text-align:center;padding:25px;color:#77838D;font-size:12px}
@media(max-width:400px){
 main{padding:14px}
 .grid{gap:9px}
 .tile{padding:14px 10px}
}
</style>
</head>
<body>

<header>
<h1>FAMILY OS</h1>
<p>La nostra famiglia, il nostro mondo</p>
</header>

<main>
<section id="welcome">
 <div class="welcome">
  <div style="font-size:45px">⌂</div>
  <h2>Benvenuti a casa</h2>
  <p>La nostra famiglia.<br>
  Tutto quello che conta, in un unico posto.</p>
  <button class="primary" onclick="enterApp()">ENTRA NELLA TUA FAMIGLIA →</button>
 </div>
</section>

<section id="home" class="hidden">
 <h2 class="section-title">La nostra casa 🏡</h2>
 <p>Organizziamo insieme la vita familiare.</p>
 <div class="grid" id="modules"></div>
</section>

<section id="detail" class="hidden">
 <button class="back" onclick="goHome()">← Torna alla casa</button>
 <div class="panel">
  <h2 id="moduleTitle"></h2>
  <p id="moduleDescription"></p>
  <div id="moduleContent"></div>
 </div>
</section>
</main>

<footer>FAMILY OS · Organizzazione semplice, vita più serena.</footer>

<script>
const data=[
 ["👨‍👩‍👧‍👦","La nostra famiglia","Componenti, ruoli e responsabilità."],
 ["📅","Calendario","Appuntamenti e impegni familiari."],
 ["🧹","Faccende domestiche","Organizziamo le attività di casa."],
 ["📚","Compiti scolastici","Compiti, verifiche e studio."],
 ["🍽️","Menù settimanale","Pianifichiamo i pasti della settimana."],
 ["🛒","Lista della spesa","Teniamo sotto controllo la spesa."],
 ["👩‍🍳","Ricette","Il nostro ricettario di famiglia."],
 ["🧊","Frigorifero e congelatore","Gestiamo alimenti e scorte."],
 ["🏷️","Etichette","Organizziamo e identifichiamo le preparazioni."],
 ["🎯","Obiettivi e punti","Piccoli traguardi da raggiungere insieme."]
];

function enterApp(){
 document.getElementById("welcome").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}

function goHome(){
 document.getElementById("detail").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}

function openModule(index){
 const item=data[index];
 document.getElementById("home").classList.add("hidden");
 document.getElementById("detail").classList.remove("hidden");
 document.getElementById("moduleTitle").textContent=item[0]+" "+item[1];
 document.getElementById("moduleDescription").textContent=item[2];

 let content="";
 if(index===2 || index===3){
  content='<h3>Le nostre attività</h3>'+
  '<div id="tasks"></div>'+
  '<input id="newTask" placeholder="Aggiungi una nuova attività">'+
  '<button onclick="addTask()">Aggiungi</button>';
  document.getElementById("moduleContent").innerHTML=content;
  addTask("Riordinare");
  addTask("Completare le attività");
  return;
 }
 if(index===4){
  content='<h3>Il nostro menù</h3>';
  ["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"].forEach(d=>{
   content+='<p><strong>'+d+'</strong><input placeholder="Pranzo e cena"></p>';
  });
 }else if(index===5){
  content='<h3>Lista della spesa</h3><div id="tasks"></div>'+
  '<input id="newTask" placeholder="Aggiungi un prodotto">'+
  '<button onclick="addTask()">Aggiungi prodotto</button>';
 }else if(index===0){
  content='<h3>La nostra famiglia</h3>'+
  '<p>Mamma · Papà · Figlio 18 anni · Figlia 14 anni · Figlio 4 anni</p>'+
  '<input placeholder="Nome del componente">'+
  '<button onclick="alert(\'Funzione in sviluppo\')">Aggiungi componente</button>';
 }else if(index===1){
  content='<h3>Appuntamenti</h3><input type="date">'+
  '<input placeholder="Descrizione appuntamento">';
 }else if(index===6){
  content='<h3>Ricettario</h3><input placeholder="Nome della ricetta">'+
  '<textarea placeholder="Ingredienti e procedimento"></textarea>';
 }else if(index===7){
  content='<h3>Gestione scorte</h3><input placeholder="Alimento">'+
  '<input type="number" placeholder="Quantità">'+
  '<input type="date" aria-label="Data di preparazione o scadenza">';
 }else if(index===8){
  content='<h3>Etichette alimentari</h3>'+
  '<input placeholder="Nome della preparazione">'+
  '<input type="date" aria-label="Data di preparazione">'+
  '<p>Etichetta digitale pronta per essere completata.</p>';
 }else{
  content='<h3>I nostri traguardi</h3>'+
  '<input placeholder="Nuovo obiettivo familiare">'+
  '<p>Ogni piccolo passo conta!</p>';
 }
 document.getElementById("moduleContent").innerHTML=content;
}

function addTask(defaultText){
 const input=document.getElementById("newTask");
 const value=defaultText || (input && input.value.trim());
 if(!value)return;
 const container=document.getElementById("tasks");
 const row=document.createElement("label");
 row.className="task";
 const check=document.createElement("input");
 check.type="checkbox";
 const span=document.createElement("span");
 span.textContent=value;
 check.addEventListener("change",()=>row.classList.toggle("done",check.checked));
 row.append(check,span);
 container.appendChild(row);
 if(input)input.value="";
}

const grid=document.getElementById("modules");
data.forEach((item,index)=>{
 const tile=document.createElement("button");
 tile.className="tile";
 tile.innerHTML='<span class="emoji">'+item[0]+'</span><strong>'+item[1]+'</strong><small>Apri modulo →</small>';
 tile.onclick=()=>openModule(index);
 grid.appendChild(tile);
});
</script>
</body>
</html>
